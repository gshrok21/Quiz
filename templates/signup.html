<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign Up</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
  body {
    background: linear-gradient(135deg, #4b0082, #1e3c72);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
    font-family: 'Segoe UI', sans-serif;
  }
  .form-box {
    background: rgba(255, 255, 255, 0.05);
    padding: 2.5rem;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    position: relative;
  }
  .form-box h2 {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .form-control {
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
  }
  .form-control:focus {
    background: rgba(255,255,255,0.2);
    box-shadow: none;
    color: white;
  }
  .btn-custom {
    background: white;
    color: #4b0082;
    font-weight: bold;
    border-radius: 10px;
    width: 100%;
    padding: 0.6rem;
    transition: 0.3s;
  }
  .btn-custom:hover {
    background: #ddd;
  }
  .link-text {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  .link-text a {
    color: #ffda79;
    text-decoration: none;
  }
  .link-text a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="form-box">
  <h2>📝 Sign Up</h2>
  <form action="/signup" method="POST">
      {%csrf_token%}
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control" name="fname" placeholder="Enter your name" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" placeholder="Enter your username" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control"  name="email" placeholder="Enter your email" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password1" placeholder="Create a password" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control" name="password2" placeholder="Re-enter your password" required />
    </div>
    <button type="submit" class="btn btn-custom">Sign Up</button>
  </form>
  <div class="mb-3"> {%for message in messages%}
  {{message}} {% endfor %}</div>
  <div class="link-text">
    Already have an account? <a href="/login_page">Login</a>
  </div>
</div>

</body>
</html>
