<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz response list</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
  body {
    background: linear-gradient(135deg, #4b0082, #1e3c72);
    color: white;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
  }
  .page-box {
    max-width: 800px;
    margin: auto;
    background: rgba(255, 255, 255, 0.05);
    padding: 2rem;
    border-radius: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
  }
  .attempt-item {
    background: rgba(255,255,255,0.07);
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>

<div class="page-box">
  <h2>Response List</h2>
  {% for data in result %}

  <div class="attempt-item" style="display:flex;justify-content:space-between;" onclick="location.href='view_response/?quizid={{data.quizid}}'"> <h4>{{data.quizid}}</h4> </div>

  {% endfor %}

  <a href="/" class="btn btn-light mt-3">Back</a>
</div>

</body>
</html>
