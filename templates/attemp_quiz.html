<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attempt Quiz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body {
background: linear-gradient(135deg, #4b0082, #1e3c72);
color: white;
font-family: 'Segoe UI', sans-serif;
padding: 20px;
}
.page-box {
max-width: 800px;
margin: auto;
background: rgba(255, 255, 255, 0.05);
padding: 2rem;
border-radius: 20px;
box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}
.quiz-card ,.quiz-cardmain {
background: rgba(255,255,255,0.07);
padding: 1rem;
border-radius: 10px;
margin-bottom: 1rem;
cursor: pointer;
transition: 0.3s;
}
.quiz-card:hover {
background: white;
color: #4b0082;
}
.btn-theme {
    background: white;
    color: #4b0082;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    transition: 0.3s;
  }
  .btn-theme:hover {
    background: #ffce00;
    color: black;
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div class="page-box">
<h2>🎯 Attempt Quiz</h2>
<form action='/attempt_quiz' method="POST">
{% csrf_token %}
<input type='text' name='quizid' required>

<button type="submit" class="btn-theme">✅ Submit Quizid</button> 
</form>
{% for message in messages %}
<div class="quiz-card">{{message}}</div>
{% endfor %}
</div>

<form action="/submit_quiz" method="POST" accept-charset="utf-8">
    {% csrf_token %}
{% for data in result %}
<div class="quiz-cardmain">
<div class="quiz-card">
{{data.question}}
</div>
<div class="quiz-card">
<input type="radio" name={{data.questionid}} value="op1" /> {{data.op1}}
</div>
<div class="quiz-card">
<input type="radio" name={{data.questionid}} value="op2" /> {{data.op2}}
</div>
<div class="quiz-card">
<input type="radio" name={{data.questionid}} value="op3" /> {{data.op3}}
</div>
<div class="quiz-card">
<input type="radio" name={{data.questionid}} value="op4" /> {{data.op4}}
</div>
</div>
{% endfor %}
{% if result %}
<button type="submit" class="btn-theme">✅ Submit Questions</button>
{% endif %}
</form>

<a href="/" class="btn btn-light mt-3">Back</a>
</div>

</body>
</html>
